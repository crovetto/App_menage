<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Ménage de l'appart</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6efe4;--card:#fff;--tx:#33291f;--mu:#8a7b6a;--ac:#e8812a;--ln:#e6d8c4}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1a15;--card:#2b241d;--tx:#f3e9da;--mu:#a89883;--ac:#f0a050;--ln:#44392d}}
:root[data-theme="dark"]{--bg:#1f1a15;--card:#2b241d;--tx:#f3e9da;--mu:#a89883;--ac:#f0a050;--ln:#44392d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Nunito,"Segoe UI",system-ui,sans-serif}
main{max-width:1100px;margin:auto;padding:16px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:860px){main{grid-template-columns:minmax(0,520px) minmax(0,1fr)}}
h1{margin:0;font-size:22px}h2{margin:0 0 10px;font-size:16px}.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px}
header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.map{position:relative;line-height:0;border-radius:16px;overflow:hidden;border:1px solid var(--ln)}.map img{width:100%;height:auto}
.hs{position:absolute;border:2px dashed transparent;border-radius:8px;background:transparent;cursor:pointer;padding:0}
.hs:hover,.hs.on{border-color:var(--ac);background:rgba(232,129,42,.22)}
.hs span{position:absolute;left:2px;top:2px;background:var(--card);color:var(--tx);font:700 11px/1 sans-serif;padding:3px 5px;border-radius:6px;opacity:.9}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button,.t{font:inherit;border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:10px;padding:6px 10px;cursor:pointer}
.tabs .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.rk{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;margin:6px 0}.bar{height:8px;border-radius:5px;background:var(--ac);margin-top:3px}
.tasks{display:grid;gap:6px}.t{display:flex;justify-content:space-between;text-align:left}.t:hover{border-color:var(--ac)}.t b{color:var(--ac)}
.lg{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--ln)}.lg small{color:var(--mu)}
.x{background:none;border:0;color:var(--mu);cursor:pointer}.mu{color:var(--mu);font-size:13px}.side{display:grid;gap:16px;align-content:start}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none}#toast.s{opacity:1}
.ch{position:absolute;height:8%;transform:translate(-50%,-88%);pointer-events:none;z-index:3;transition:opacity .6s,scale .6s}
.ch span{display:block;height:100%}.ch img{height:100%;width:auto;display:block;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));animation:bob .45s ease-in-out infinite alternate}
.ch.fly{height:4.5%}.ch.fly img{animation-duration:.9s}.ch.in{opacity:0;scale:.4}@keyframes bob{to{transform:translateY(-6%)}}
@media(prefers-reduced-motion:reduce){.ch img{animation:none}}
.ch.stay img{animation:none}.ch.sit span{translate:0 6%}.ch.lie span{rotate:-90deg}
.ch[data-i]::after{content:attr(data-i);position:absolute;left:50%;top:0;transform:translate(-50%,-90%);font-size:clamp(18px,3.6vw,26px);line-height:1;background:rgba(255,255,255,.92);border-radius:50%;padding:3px;box-shadow:0 2px 5px rgba(0,0,0,.35)}
</style></head><body><main>

<script>
const C=[["Passer l'aspirateur",3],["Sortir les poubelles",2]];
const R={bua:["Buanderie",69,11.5,15,13,[["Lancer une machine",1],["Étendre / plier le linge",2],["Repasser",3],["Ranger les produits",1]]],
ent:["Entrée",70,26,24,14,[["Ranger les chaussures",2],["Laver le sol",2],["Secouer le tapis",1]]],
sal:["Salon",23,46,36,21,[["Aspirateur",3],["Dépoussiérer",2],["Ranger",1],["Laver le sol",3]]],
bal:["Balcon",3,45,18,29,[["Arroser les plantes",1],["Balayer",2],["Nettoyer les vitres",3]]],
cui:["Cuisine",57,62,30,24,[["Faire la vaisselle",2],["Nettoyer plaques et plan",3],["Vider le lave-vaisselle",1],["Sortir les poubelles",2],["Nettoyer le frigo",4],["Laver le sol",3]]],
cor:["Couloir",60,14,8,28,[["Aspirateur",3],["Laver le sol",3]]]};
const $=s=>document.querySelector(s);let db,user,uid,logs=[],names={},per="week",sel=null,live=false;
const PER={week:"Semaine",month:"Mois",all:"Total"};
function since(){const d=new Date();if(per==="all")return 0;if(per==="month")return new Date(d.getFullYear(),d.getMonth(),1).getTime();const k=(d.getDay()+6)%7;return new Date(d.getFullYear(),d.getMonth(),d.getDate()-k).getTime()}
const nm=u=>u===uid?"Moi":(names[u]||"Colocataire");
function toast(t){const e=$("#toast");e.textContent=t;e.className="s";setTimeout(()=>e.className="",1800)}
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
$("#map").insertAdjacentHTML("beforeend",Object.entries(R).map(([k,r])=>`<button class="hs" data-k="${k}" style="left:${r[1]}%;top:${r[2]}%;width:${r[3]}%;height:${r[4]}%"></button>`).join(""));
$("#map").onclick=e=>{const b=e.target.closest(".hs");if(b){sel=b.dataset.k;render()}};
async function add(k,i){if(!live)return toast("Connecte-toi pour valider une tâche");const t=R[k][5][i];
 try{await db.collection("logs").doc(crypto.randomUUID()).set({r:k,t:t[0],p:t[1],u:uid,ts:Date.now()});toast("+"+t[1]+" pts, bravo !")}catch(e){toast("Écriture refusée (accès contributeur requis)")}}
async function del(id){try{await db.collection("logs").doc(id).delete()}catch(e){toast("Suppression impossible")}}
function render(){
 document.querySelectorAll(".hs").forEach(b=>b.classList.toggle("on",b.dataset.k===sel));
 if(sel){const r=R[sel];$("#room").innerHTML=`<h2>${r[0]}</h2><div class="tasks">${r[5].map((t,i)=>`<button class="t" data-i="${i}">${t[0]}<b>+${t[1]}</b></button>`).join("")}</div>`;
  $("#room").querySelectorAll(".t").forEach(b=>b.onclick=()=>add(sel,+b.dataset.i))}
 $("#tabs").innerHTML=Object.entries(PER).map(([k,v])=>`<button data-p="${k}" class="${k===per?"on":""}">${v}</button>`).join("");
 $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{per=b.dataset.p;render()});
 const s=since(),tot={};logs.filter(l=>l.ts>=s).forEach(l=>tot[l.u]=(tot[l.u]||0)+l.p);
 const rk=Object.entries(tot).sort((a,b)=>b[1]-a[1]),mx=rk.length?rk[0][1]:1;
 $("#rank").innerHTML=rk.length?rk.map(([u,p],i)=>`<div class="rk"><span>${["🥇","🥈","🥉"][i]||i+1}</span><div>${esc(nm(u))}<div class="bar" style="width:${Math.max(4,p/mx*100)}%"></div></div><b>${p} pts</b></div>`).join(""):'<p class="mu">Aucune tâche sur cette période.</p>';
 $("#feed").innerHTML=logs.slice(0,15).map(l=>`<div class="lg"><div>${esc(nm(l.u))} · ${esc(l.t)}<br><small>${R[l.r]?R[l.r][0]:""} · ${new Date(l.ts).toLocaleString("fr-CH",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</small></div><span>+${l.p}${l.u===uid?` <button class="x" data-d="${l.id}" title="Annuler">✕</button>`:""}</span></div>`).join("")||'<p class="mu">Rien pour l\'instant.</p>';
 $("#feed").querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>del(b.dataset.d))}
async function init(){render();
 try{user=await claude.use("user");db=await claude.use("db")}catch(e){}
 if(!db||!user){$("#me").textContent="Mode lecture : connecte-toi à claude.ai";return}
 uid=await user.id();live=true;$("#me").textContent="Connecté";
